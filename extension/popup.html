<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; width: 260px; margin: 0; padding: 14px 16px; background: #0d1b3e; color: #e2e8f0; }
  h1 { font-size: 15px; margin: 0 0 4px; color: #fff; }
  p.sub { font-size: 11px; color: #94a3b8; margin: 0 0 12px; }
  a.tool { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin: 4px 0; border-radius: 8px; background: #1e293b; color: #e2e8f0; text-decoration: none; font-size: 13px; }
  a.tool:hover { background: #2563eb; color: #fff; }
  p.privacy { font-size: 10px; color: #64748b; margin: 12px 0 0; line-height: 1.4; }
</style>
</head>
<body>
  <h1>⚡ CommandEditor</h1>
  <p class="sub">Private, in-browser PDF tools</p>
  <a class="tool" href="https://commandeditor.com/" target="_blank">🏠 Open CommandEditor</a>
  <a class="tool" href="https://commandeditor.com/?tool=merge" target="_blank">🔀 Merge PDFs</a>
  <a class="tool" href="https://commandeditor.com/?tool=compress" target="_blank">🗜️ Compress PDF</a>
  <a class="tool" href="https://commandeditor.com/?tool=sign" target="_blank">✍️ Sign PDF</a>
  <a class="tool" href="https://commandeditor.com/?tool=ocr" target="_blank">🔍 OCR / Searchable</a>
  <a class="tool" href="https://commandeditor.com/?tool=collab" target="_blank">🤝 Co-Review Room</a>
  <p class="privacy">🔒 Your files never leave your device. This extension has no access to page content, no analytics, and makes no network requests of its own.</p>
</body>
</html>
