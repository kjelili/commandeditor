[package]
name = "commandeditor-desktop"
version = "1.1.0"
description = "CommandEditor Desktop - Native shell for the privacy-first PDF toolkit"
authors = ["CommandEditor Team"]
license = "MIT"
repository = "https://github.com/kjelili/commandeditor"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [
  "shell-open",
  "dialog-open",
  "dialog-save",
  "global-shortcut",
  "notification-all",
  "clipboard-write-text",
  "clipboard-read-text",
  "window-show",
  "window-hide",
  "window-set-focus",
  "window-start-dragging",
  "window-print",
  "system-tray",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }

dirs = "5.0"
fuzzy-matcher = "0.3"
urlencoding = "2.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]