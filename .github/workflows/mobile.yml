# CommandEditor Mobile (Android) build
#
# Wraps the static web export in a Capacitor Android project and builds a debug
# APK. Runs on manual dispatch or a `mobile-v*` tag. iOS is built locally in
# Xcode (needs macOS) — see mobile/README.md.
name: mobile-android

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify pnpm is on PATH
        run: pnpm --version

      - name: Install web dependencies
        run: pnpm install --ignore-scripts

      - name: Build web app (static export for mobile)
        run: pnpm build
        env:
          MOBILE_BUILD: '1'

      - name: Install Capacitor deps
        run: cd mobile && npm install

      - name: Add Android platform (if missing) + sync web assets
        run: |
          cd mobile
          if [ ! -d android ]; then npx --no-install cap add android; fi
          npx --no-install cap sync android

      - name: Ensure camera + microphone permissions (Android manifest)
        run: |
          MANIFEST=mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n\n    <application#' "$MANIFEST"
          echo "--- permissions in manifest ---"; grep -n 'uses-permission\|uses-feature' "$MANIFEST" || true

      - name: Generate branded app icons + splash (from the command mark)
        run: cd mobile && npx --no-install @capacitor/assets generate --android

      # --- Signed release AAB (only when signing secrets are present) ---
      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release AAB
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          cd mobile/android && chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload signed AAB
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: commandeditor-android-release-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # --- Debug APK fallback (when no signing secrets configured) ---
      - name: Build debug APK
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: cd mobile/android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: commandeditor-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
