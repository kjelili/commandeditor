# CommandEditor Desktop release pipeline
#
# Triggers:
#   - tag push `desktop-v*`  → full matrix build + GitHub Release with installers
#   - workflow_dispatch      → full matrix build, artifacts only (no release)
name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # NOTE: deliberately NO `cache: pnpm`.
          # setup-node's package-manager cache runs `pnpm store path` during
          # setup; on these runners pnpm isn't on PATH at that moment, which
          # fails with "Unable to locate executable file: pnpm" on all 3 OSes.
          # pnpm/action-setup (above) already puts pnpm on PATH for the run
          # steps below, so the cache line is both unnecessary and the cause.

      - name: Verify pnpm is on PATH
        run: pnpm --version

      - name: Install web dependencies
        # --ignore-scripts: sharp's postinstall build is unnecessary
        # (images.unoptimized; webpack aliases sharp away)
        run: pnpm install --ignore-scripts

      - name: Build web app (static export for Tauri)
        run: pnpm build
        env:
          TAURI_BUILD: '1'

      - name: Install desktop npm dependencies (Tauri CLI)
        run: cd desktop && npm install

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: 'CommandEditor Desktop v__VERSION__'
          releaseBody: 'Native desktop build of CommandEditor — the private, in-browser PDF toolkit, now as an offline app.'
          releaseDraft: true
          prerelease: false

      - name: Upload bundles (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: commandeditor-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**
          if-no-files-found: warn
