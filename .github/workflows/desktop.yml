# CommandEditor Desktop release pipeline
#
# Triggers:
#   - tag push `desktop-v*`  → full matrix build + GitHub Release with installers
#   - workflow_dispatch      → full matrix build, artifacts only (no release)
name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

# tauri-action creates a GitHub Release on tag builds — that needs write access
# to repo contents. Without this the run fails with
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Exposed so the Windows signing step can detect whether Azure Trusted
    # Signing is configured. Empty when unset -> the step skips, build stays green.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # No `cache: pnpm` — it runs `pnpm store path` before pnpm is on PATH
          # and fails with "Unable to locate executable file: pnpm".

      - name: Verify pnpm is on PATH
        run: pnpm --version

      - name: Install web dependencies
        run: pnpm install --ignore-scripts

      - name: Build web app (static export for Tauri)
        run: pnpm build
        env:
          TAURI_BUILD: '1'
          NEXT_PUBLIC_TAURI_BUILD: '1'

      - name: Install desktop npm dependencies (Tauri CLI)
        run: cd desktop && npm install

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing + notarization. tauri-action signs during bundling
          # (correct ordering, no post-build step needed). Inactive until the
          # Apple secrets exist, in which case the .dmg is signed AND notarized.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          # Only publish a Release on tag pushes. On manual (workflow_dispatch)
          # runs, leaving these empty tells tauri-action to just build — no
          # release is attempted, so no write permission is even exercised.
          tagName: ${{ github.event_name == 'push' && 'desktop-v__VERSION__' || '' }}
          releaseName: ${{ github.event_name == 'push' && 'CommandEditor Desktop v__VERSION__' || '' }}
          releaseBody: 'Native desktop build of CommandEditor — the private, in-browser PDF toolkit, now as an offline app.'
          releaseDraft: true
          prerelease: false

      # Windows code signing via Azure Trusted Signing (~$9.99/mo, cloud HSM,
      # no hardware token). Signs the produced installers so SmartScreen stops
      # warning (reputation still ramps with download volume). Runs only when the
      # Azure service-principal secrets exist, so absent config leaves the build
      # green with unsigned installers.
      #
      # Required repo secrets:  AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
      # Required repo variables: AZURE_TS_ENDPOINT, AZURE_TS_ACCOUNT, AZURE_TS_PROFILE
      #
      # NOTE: this signs the workflow_dispatch artifacts correctly. For tag/release
      # runs, tauri-action uploads the installers to the draft Release *before* this
      # step, so those assets would be unsigned — ask me to split build/sign/release
      # if you want signed Release assets.
      - name: Sign Windows installers (Azure Trusted Signing)
        if: matrix.os == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TS_PROFILE }}
          files-folder: desktop/src-tauri/target/release/bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # ── Alternative: Windows signing via SSL.com eSigner (cloud, CI-native) ──
      # Runs only when the ES_* secrets exist AND Azure is NOT configured, so the
      # two signers never double-sign. Add repo secrets:
      #   ES_USERNAME, ES_PASSWORD, ES_CREDENTIAL_ID, ES_TOTP_SECRET
      # (For a demo/sandbox cert set environment_name: TEST below; PROD = real cert.)
      # Supply-chain note: @develop is a moving branch — pin to a release SHA once live.
      - name: Detect Windows installers (eSigner)
        id: winbundle
        if: matrix.os == 'windows-latest' && env.ES_USERNAME != '' && env.AZURE_CLIENT_ID == ''
        shell: pwsh
        run: |
          $root = 'desktop/src-tauri/target/release/bundle'
          $nsis = (Test-Path (Join-Path $root 'nsis')).ToString().ToLower()
          $msi  = (Test-Path (Join-Path $root 'msi')).ToString().ToLower()
          "has_nsis=$nsis" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "has_msi=$msi"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sign NSIS installer (SSL.com eSigner)
        if: matrix.os == 'windows-latest' && env.ES_USERNAME != '' && env.AZURE_CLIENT_ID == '' && steps.winbundle.outputs.has_nsis == 'true'
        uses: sslcom/esigner-codesign@develop
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: desktop/src-tauri/target/release/bundle/nsis
          override: true
          malware_block: false
          environment_name: PROD

      - name: Sign MSI installer (SSL.com eSigner)
        if: matrix.os == 'windows-latest' && env.ES_USERNAME != '' && env.AZURE_CLIENT_ID == '' && steps.winbundle.outputs.has_msi == 'true'
        uses: sslcom/esigner-codesign@develop
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: desktop/src-tauri/target/release/bundle/msi
          override: true
          malware_block: false
          environment_name: PROD

      - name: Upload bundles (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: commandeditor-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**
          if-no-files-found: warn
